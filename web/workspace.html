<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="utf-8"/>
<title>Release Testing Workspace — AI 自动化测试工作台</title>
<style>
:root { --bg:#0f1419; --panel:#1a2129; --panel2:#212a35; --line:#2e3a47; --text:#e6edf3; --dim:#8b98a5; --accent:#4da3ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; --risk:#ff7b72; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; font-size:14px; }
header { display:flex; align-items:center; gap:16px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
header h1 { font-size:16px; margin:0; }
header a { color:var(--dim); text-decoration:none; font-size:13px; }
header a:hover { color:var(--text); }
nav { display:flex; gap:6px; margin-left:auto; }
nav button { background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
main { padding:18px; max-width:1400px; margin:0 auto; }
section.view { display:none; }
section.view.active { display:block; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
.panel h2 { font-size:14px; margin:0 0 10px; color:var(--accent); }
.panel h3 { font-size:13px; margin:8px 0 6px; }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; }
th { color:var(--dim); font-weight:500; }
.tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; margin-right:4px; }
.ok { background:#12351c; color:var(--ok); }
.warn { background:#3a2d10; color:var(--warn); }
.err { background:#3a1214; color:var(--err); }
.dim { color:var(--dim); }
.risk { background:#3a1517; color:var(--risk); }
button.action { background:var(--accent); border:none; color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); padding:6px 12px; border-radius:6px; cursor:pointer; }
input[type=text],textarea,select { background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:7px 10px; border-radius:6px; font-size:13px; width:100%; }
textarea { min-height:120px; font-family:inherit; }
.tree { font-family:"Cascadia Code",Consolas,monospace; font-size:13px; line-height:1.7; }
.tree .cap { color:var(--accent); cursor:pointer; }
.tree .cap:hover { text-decoration:underline; }
.metrics { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.metric { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; min-width:140px; }
.metric span { display:block; color:var(--dim); font-size:12px; }
.metric strong { font-size:20px; }
.timeline { border-left:2px solid var(--line); padding-left:14px; }
.timeline .item { position:relative; margin-bottom:10px; }
.timeline .item::before { content:""; position:absolute; left:-19px; top:6px; width:8px; height:8px; border-radius:50%; background:var(--accent); }
.blocking { background:#3a1214; border:1px solid var(--err); border-radius:8px; padding:10px 14px; margin-bottom:14px; }
.blocking li { color:var(--err); }
.stepper { display:flex; gap:4px; margin:12px 0; flex-wrap:wrap; }
.stepper .step { padding:6px 12px; border-radius:6px; border:1px solid var(--line); color:var(--dim); font-size:12px; }
.stepper .step.done { border-color:var(--ok); color:var(--ok); }
.stepper .step.now { border-color:var(--accent); color:var(--accent); background:#10263c; }
.stepper .step.blocked { border-color:var(--err); color:var(--err); }
.detail { margin:4px 0 0; }
.hidden { display:none; }
button:disabled { opacity:.5; cursor:not-allowed; }
#toast { position:fixed; bottom:18px; right:18px; background:var(--panel2); border:1px solid var(--line); padding:10px 16px; border-radius:8px; display:none; max-width:420px; }
</style>
</head>
<body>
<header>
  <h1>Release Testing Workspace</h1>
  <a href="/">← 主工作台</a>
  <nav>
    <button data-view="overview" class="active">Overview</button>
    <button data-view="product">Product</button>
    <button data-view="release">Release</button>
    <button data-view="queue">Review Queue</button>
    <button data-view="coverage">Coverage</button>
    <button data-view="search">Search</button>
    <button data-view="diagnostics">Diagnostics</button>
  </nav>
</header>
<main>
    <div id="entity-detail"></div>
  <section id="overview" class="view active"></section>
  <section id="product" class="view"></section>
  <section id="release" class="view"></section>
  <section id="queue" class="view"></section>
  <section id="coverage" class="view"></section>
  <section id="search" class="view"></section>
  <section id="diagnostics" class="view"></section>
</main>
<div id="toast"></div>
<script>
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const VIEWS = ["overview", "product", "release", "queue", "coverage", "search", "diagnostics"];
const state = { view: "overview", requirement: "", plan: "", deepLink: undefined };

function activate(view) {
  state.view = view;
  const ed = $("#entity-detail"); if (ed) ed.style.display = "none";
  $$("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  $$("section.view").forEach((s) => s.classList.toggle("active", s.id === view));
  // 深链激活时保留实体 hash（#asset/...），使 reload 后能恢复 detail
  if (!state.deepLink) location.hash = view;
  load(view);
}
$$("nav button").forEach((b) => b.addEventListener("click", () => activate(b.dataset.view)));

function toast(msg, isErr = false) {
  const t = $("#toast");
  t.style.display = "block";
  t.style.borderColor = isErr ? "var(--err)" : "var(--line)";
  t.textContent = msg;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => (t.style.display = "none"), 4000);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.reason || `HTTP ${res.status}`);
  return data;
}

function tag(text, cls) { return `<span class="tag ${cls}">${text}</span>`; }

async function load(view) {
  try {
    if (view === "overview") await loadOverview();
    if (view === "product") await loadProduct();
    if (view === "release") await loadRelease();
    if (view === "queue") await loadQueue();
    if (view === "coverage") await loadCoverage();
    if (view === "search") loadSearch();
    if (view === "diagnostics") await loadDiagnostics();
  } catch (e) { toast(`加载失败: ${e.message}`, true); }
}

// ============ Overview ============
async function loadOverview() {
  const [overview, health, queue] = await Promise.all([
    api("/api/workspace/overview"),
    api("/api/workspace/health"),
    api("/api/workspace/review-queue")
  ]);
  const active = overview.capabilities.reduce((a, c) => a + c.coverage.activeAssets, 0);
  const ready = overview.capabilities.reduce((a, c) => a + c.coverage.executionReady, 0);
  $("#overview").innerHTML = `
    <div class="metrics">
      <div class="metric"><span>Capabilities</span><strong>${overview.capabilities.length}</strong></div>
      <div class="metric"><span>Modules</span><strong>${overview.modules.length}</strong></div>
      <div class="metric"><span>Active Test Assets</span><strong>${active}</strong></div>
      <div class="metric"><span>Execution Ready</span><strong>${ready}</strong></div>
      <div class="metric"><span>Open Reviews</span><strong>${queue.length}</strong></div>
    </div>
    <div class="grid">
      <div class="panel"><h2>System Health</h2>
        ${Object.entries(health).map(([k, v]) => `<div>${tag(k, v.pass ? "ok" : "err")} ${v.pass ? "PASS" : "ISSUES: " + v.issues.join("; ")}</div>`).join("")}
      </div>
      <div class="panel"><h2>Product Health (Attention)</h2>
        ${overview.capabilities.filter((c) => c.health !== "HEALTHY").slice(0, 8).map((c) => `<div>${c.name} ${tag(c.health, c.health === "NEEDS_ATTENTION" ? "warn" : "dim")} assets=${c.coverage.activeAssets}</div>`).join("") || '<div class="dim">All healthy</div>'}
      </div>
      <div class="panel"><h2>Latest Release</h2>
        <div class="dim">选择 Release 查看完整生命周期</div>
        <button class="action" onclick="activate('release')">打开 Release Workspace</button>
      </div>
    </div>`;
}

// ============ Product ============
async function loadProduct() {
  const overview = await api("/api/workspace/overview");
  const tree = overview.modules.map((mod) => {
    const caps = overview.capabilities.filter((c) => c.capabilityId.startsWith(mod + "."));
    return `<div>${mod}
      ${caps.map((c) => `<div style="padding-left:18px">• <span class="cap" onclick="showCapability('${c.capabilityId}')">${c.capabilityId}</span>
        <span class="dim">assets=${c.coverage.activeAssets} ready=${c.coverage.executionReady} runs=${c.coverage.executed}</span>
        ${c.health === "HEALTHY" ? tag("OK", "ok") : tag(c.health, "warn")}</div>`).join("")}
    </div>`;
  }).join("");
  $("#product").innerHTML = `
    <div class="panel"><h2>Product Structure（projection，来自现有 stores）</h2>
      <div class="tree">${tree || '<div class="dim">No modules classified</div>'}</div>
      ${overview.unclassifiedCapabilities.length ? `<div class="detail">${tag("UNCLASSIFIED", "warn")} ${overview.unclassifiedCapabilities.join(", ")}</div>` : ""}
    </div>
    <div id="cap-detail"></div>`;
}
async function showCapability(capId) {
  const overview = await api("/api/workspace/overview");
  const cap = overview.capabilities.find((c) => c.capabilityId === capId);
  if (!cap) return;
  $("#cap-detail").innerHTML = `
    <div class="panel">
      <h2>Capability: ${cap.capabilityId}</h2>
      <div class="grid">
        <div class="panel"><h3>Business Rules</h3>${cap.businessRules.slice(0, 10).join("<br/>") || '<span class="dim">-</span>'}</div>
        <div class="panel"><h3>Requirements</h3>${cap.requirements.slice(0, 10).join("<br/>") || '<span class="dim">-</span>'}</div>
        <div class="panel"><h3>Pages</h3>${cap.pages.slice(0, 10).join("<br/>") || '<span class="dim">-</span>'}</div>
        <div class="panel"><h3>Test Assets</h3>${cap.testAssets.slice(0, 10).join("<br/>") || '<span class="dim">-</span>'}</div>
      </div>
      <div class="metrics">
        <div class="metric"><span>Active</span><strong>${cap.coverage.activeAssets}</strong></div>
        <div class="metric"><span>Ready</span><strong>${cap.coverage.executionReady}</strong></div>
        <div class="metric"><span>Executed</span><strong>${cap.coverage.executed}</strong></div>
        <div class="metric"><span>Passed</span><strong>${cap.coverage.passed}</strong></div>
        <div class="metric"><span>Last Run</span><strong style="font-size:12px">${cap.lastRun ? new Date(cap.lastRun).toLocaleString() : "-"}</strong></div>
      </div>
    </div>`;
}

// ============ Release Workspace ============
async function loadRelease() {
  $("#release").innerHTML = `
    <div class="panel">
      <h2>Release Workspace（V2 Requirement Intake）</h2>
      <label>Requirement ID <input type="text" id="rel-req" value="R_ACCEPT"/></label>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="action" onclick="analyzeRelease()">Analyze Requirement</button>
        <button class="ghost" onclick="generateImpact()">Generate Impact</button>
        <button class="ghost" onclick="generatePlan()">Generate Regression Plan</button>
        <button class="ghost" onclick="loadReleaseView()">加载 Release 视图</button>
      </div>
      <div><label style="display:block;margin-top:8px">V2 Requirement 文本
        <textarea id="rel-text">新增免验证地址提现功能：仅白名单地址提现不需要 Google 2FA 验证；非白名单地址提现必须完成 Google 2FA 验证。前提：用户已登录且已完成 KYC2 认证。删除地址需二次确认。</textarea></label></div>
    </div>
    <div id="rel-view"></div>`;
}
async function generateImpact() {
  const requirementId = $("#rel-req").value.trim() || "R_ACCEPT";
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "GENERATE_IMPACT", requirementId }) });
  toast(res.ok ? `Impact generated: ${res.result.impacted} impacted, ${res.result.criticalUncovered.length} critical uncovered` : `失败: ${res.error}`, !res.ok);
  await loadReleaseView();
}
async function generatePlan() {
  const requirementId = $("#rel-req").value.trim() || "R_ACCEPT";
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "GENERATE_PLAN", requirementId, environment: "UAT" }) });
  toast(res.ok ? `Plan ${res.result.planId} ${res.result.status}: ${res.result.selected} selected, ${res.result.newTests} new tests` : `失败: ${res.error}`, !res.ok);
  await loadReleaseView();
}
async function analyzeRelease() {
  const requirementId = $("#rel-req").value.trim() || "R_ACCEPT";
  const text = $("#rel-text").value.trim();
  const res = await api("/api/workspace/command", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ type: "ANALYZE_REQUIREMENT", requirementId, requirementText: text })
  });
  toast(res.ok ? `Requirement ${requirementId} analyzed: ${res.result.rules} rules / ${res.result.acs} ACs` : `失败: ${res.error}`, !res.ok);
  await loadReleaseView();
}
async function loadReleaseView() {
  const requirementId = $("#rel-req")?.value.trim() || "R_ACCEPT";
  const view = await api(`/api/workspace/release?releaseId=release-${requirementId}&requirement=${requirementId}`);
  state.requirement = requirementId;
  const plan = view.regressionPlan;
  const steps = [
    ["Requirement", view.requirementStatus === "ANALYZED" ? "done" : "now"],
    ["Impact", plan ? "done" : "blocked"],
    ["Test Changes", plan ? (plan.newTestRequests.length ? "now" : "done") : "blocked"],
    ["Regression Plan", plan ? (plan.status === "READY_FOR_REVIEW" || plan.status === "APPROVED" ? "done" : "now") : "blocked"],
    ["Review", plan && plan.status === "APPROVED" ? "done" : plan ? "now" : "blocked"],
    ["Execute", plan && plan.status === "APPROVED" ? "now" : "blocked"],
    ["Result", plan && plan.status === "APPROVED" ? "now" : "blocked"]
  ];
  $("#rel-view").innerHTML = `
    <div class="panel" style="margin-top:14px">
      <h2>${view.releaseId} — ${view.requirements.join(",")}</h2>
      <div class="stepper">${steps.map(([name, cls]) => `<span class="step ${cls}">${name}</span>`).join("")}</div>
      ${view.blockingItems.length ? `<div class="blocking"><strong>Blocking Items</strong><ul>${view.blockingItems.map((b) => `<li>${b}</li>`).join("")}</ul></div>` : ""}
      <div class="metrics">
        <div class="metric"><span>Impacted Assets</span><strong>${view.impactSummary.impactedAssets}</strong></div>
        <div class="metric"><span>New Tests</span><strong>${view.impactSummary.newTests}</strong></div>
        <div class="metric"><span>Updates</span><strong>${view.impactSummary.updates}</strong></div>
        <div class="metric"><span>Excluded</span><strong>${view.impactSummary.excluded}</strong></div>
        <div class="metric"><span>Recommended</span><strong style="font-size:11px">${view.recommendedNextAction}</strong></div>
      </div>
      ${plan ? renderPlan(plan) : '<div class="panel"><h3>Regression Plan</h3><div class="dim">暂无 Plan（先 impact:analyze + regression:plan 或点击 Analyze）</div></div>'}
      <div class="panel"><h3>Activity Timeline</h3><div class="timeline">${view.timeline.slice(-8).map((t) => `<div class="item"><b>${t.what}</b> <span class="dim">${t.why} · ${new Date(t.at).toLocaleString()} · ${t.source}</span></div>`).join("") || '<span class="dim">暂无活动</span>'}</div></div>
    </div>`;
}
function renderPlan(plan) {
  const rows = plan.selectedAssets.filter((s) => s.selectionLevel !== "EXCLUDED").map((s) => `
    <tr><td>${s.assetId}@${s.assetVersion}</td><td>${tag(s.selectionLevel, s.selectionLevel === "MUST_RUN" ? "err" : s.selectionLevel === "SHOULD_RUN" ? "warn" : "ok")}</td>
    <td>${tag(s.disposition, "dim")}</td><td class="detail" title="${s.whySelected.join("\n")}">${s.whySelected.slice(0, 2).join("; ")}</td></tr>`).join("");
  return `<div class="panel"><h3>Regression Plan ${plan.version} [${plan.status}]</h3>
    <div class="metrics">
      <div class="metric"><span>Selected</span><strong>${plan.selectedAssets.filter((s) => s.selectionLevel !== "EXCLUDED").length}</strong></div>
      <div class="metric"><span>Must Run</span><strong>${plan.selectedAssets.filter((s) => s.selectionLevel === "MUST_RUN").length}</strong></div>
      <div class="metric"><span>Needs Auth</span><strong>${plan.riskSummary.needsAuthorization}</strong></div>
      <div class="metric"><span>New Tests</span><strong>${plan.newTestRequests.length}</strong></div>
      <div class="metric"><span>Reduction</span><strong>${(100 * (1 - plan.selectedAssets.filter((s) => s.selectionLevel !== "EXCLUDED").length / Math.max(1, plan.selectedAssets.length + plan.excludedAssets.length))).toFixed(0)}%</strong></div>
    </div>
    <table><thead><tr><th>Asset</th><th>Level</th><th>Disposition</th><th>Why</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="action" onclick="approvePlan()">Approve Plan</button>
      <button class="ghost" onclick="runPlan()">Run Ready Tests</button>
      ${plan.newTestRequests.length ? `<button class="action" onclick="generateTestDesign()">Generate Test Design (${plan.newTestRequests.length})</button>` : ""}
      <button class="ghost" onclick="refreshPlan()">Refresh Plan</button>
    </div>
    <div id="plan-msg"></div>
    <div id="candidate-panel"></div>
    <div id="update-panel"></div>
    ${plan.updateRequiredAssets.length ? `<div class="panel"><h3>Asset Updates Required</h3>${plan.updateRequiredAssets.map((id) => `<div>${id} ${tag("UPDATE_REQUIRED", "err")} <button class="ghost" onclick="showUpdatePreview('${id}')">View Update (OLD vs PROPOSED)</button></div>`).join("")}</div>` : ""}</div>`;
}
async function generateTestDesign() {
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "GENERATE_TEST_DESIGN", requirementId: state.requirement, reviewer: "workspace" }) });
  if (!res.ok) { toast(`Generate 失败: ${res.error}`, true); return; }
  toast(`Generated ${res.result.total} candidates（P11 pipeline，待审查）`);
  await renderCandidates();
}
async function renderCandidates() {
  // 从 pending-candidates 读取（通过 release view 的 plan 无直接 API；复用 GENERATE 幂等返回）
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "GENERATE_TEST_DESIGN", requirementId: state.requirement, reviewer: "workspace" }) });
  const panel = $("#candidate-panel");
  if (!res.ok || !res.result.candidates.length) { panel.innerHTML = ""; return; }
  panel.innerHTML = `<div class="panel"><h3>Generated Candidates（P11）— 审查后批准</h3>
    ${res.result.candidates.map((c, i) => `<div style="margin:6px 0">
      <b>${c.title}</b> <span class="dim">${c.objective}</span> ${tag(c.risk, c.risk === "CRITICAL" ? "err" : "warn")}
      <button class="ghost" onclick="approveCandidate(${i})">Approve</button>
      <button class="ghost" onclick="editCandidate(${i})">Edit Title + Approve</button>
    </div>`).join("")}
  </div>`;
}
async function approveCandidate(index) {
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "CANDIDATE_APPROVE", requirementId: state.requirement, candidateIndex: index, reviewer: "workspace" }) });
  if (!res.ok) { toast(`Approve 失败: ${res.error}`, true); return; }
  toast(`ACTIVE TestAsset ${res.result.testAssetId}（humanAuthoredFields=${res.result.humanAuthoredFields.join(",") || "none"}）`);
  await loadReleaseView();
}
async function editCandidate(index) {
  const newTitle = prompt("编辑 Title（humanAuthoredFields 将保留）:", "Human 修改后的候选标题");
  if (!newTitle) return;
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "CANDIDATE_APPROVE", requirementId: state.requirement, candidateIndex: index, reviewer: "workspace", edits: { field: "title", value: newTitle } }) });
  if (!res.ok) { toast(`Edit+Approve 失败: ${res.error}`, true); return; }
  toast(`ACTIVE TestAsset ${res.result.testAssetId}（humanAuthoredFields=${res.result.humanAuthoredFields.join(",")}）`);
  await loadReleaseView();
}
async function refreshPlan() {
  const planId = `RP-${state.requirement}`;
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "REFRESH_PLAN", planId, reviewer: "workspace" }) });
  if (!res.ok) { toast(`Refresh 失败: ${res.error}`, true); return; }
  toast(`Plan refreshed: ${res.result.planId} ${res.result.version} → ${res.result.status}（newTests=${res.result.newTests} updates=${res.result.updates}）`);
  await loadReleaseView();
}
async function showUpdatePreview(assetId) {
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "ASSET_UPDATE_PREVIEW", assetId }) });
  if (!res.ok) { toast(`Preview 失败: ${res.error}`, true); return; }
  const o = res.result.old, n = res.result.proposed;
  $("#update-panel").innerHTML = `<div class="panel"><h3>Asset Update: ${assetId}（OLD v${o.version} vs PROPOSED v${n.version}）</h3>
    <div class="grid">
      <div class="panel"><h3>OLD</h3><div>Actions: ${o.actions.map(a=>a.action+":"+a.target).join("; ")}</div><div>Expected: ${o.expected.map(e=>e.statement).join("; ")}</div><div>Risk: ${o.risk.designPriority}/${o.risk.executionRisk}</div><div>Data: ${o.data.map(d=>d.dimension+"="+d.value).join("; ")}</div></div>
      <div class="panel"><h3>PROPOSED</h3><div>Actions: ${n.actions.map(a=>a.action+":"+a.target).join("; ")}</div><div>Expected: ${n.expected.map(e=>e.statement).join("; ")}</div><div>Risk: ${n.risk.designPriority}/${n.risk.executionRisk}</div><div>Data: ${n.data.map(d=>d.dimension+"="+d.value).join("; ")}</div></div>
    </div>
    <button class="action" onclick="approveUpdateWithVersion('${assetId}','${o.version}')">Approve Update（old SUPERSEDED → new ACTIVE）</button>
  </div>`;
}
async function approveUpdateWithVersion(assetId, expectedVersion) {
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "APPROVE_ASSET_UPDATE", assetId, expectedVersion, reviewer: "workspace", reason: "UI approve update" }) });
  toast(res.ok ? `${assetId} ${res.result.oldVersion} → ${res.result.newVersion}（old SUPERSEDED / new ACTIVE）` : `失败: ${res.error}`, !res.ok);
  if (!res.ok) $("#update-panel").innerHTML = `<div class="err">${res.error}</div>`;
  await loadReleaseView();
}
async function approvePlan() {
  const planId = `RP-${state.requirement}`;
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "APPROVE_REGRESSION", planId, reviewer: "workspace", reason: "UI approve" }) });
  toast(res.ok ? `Plan ${res.result.planId} ${res.result.version} → ${res.result.status}` : `失败: ${res.error}`, !res.ok);
  await loadReleaseView();
}
async function runPlan() {
  const planId = `RP-${state.requirement}`;
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "RUN_REGRESSION", planId, environment: "LOCAL" }) });
  if (!res.ok) { toast(`失败: ${res.error}`, true); return; }
  const r = res.result;
  const clsOf = (st) => st === "PRODUCT_FAILURE" || st === "ASSERTION_FAILURE" ? "err" : st === "MODEL_FAILURE" ? "warn" : st === "ENVIRONMENT_FAILURE" ? "warn" : "ok";
  const labelOf = (st) => st === "ASSERTION_FAILURE" || st === "PRODUCT_FAILURE" ? "Product/Assertion Failure" : st === "MODEL_FAILURE" ? "Automation/Model Failure" : st === "ENVIRONMENT_FAILURE" ? "Environment Failure" : st;
  const assetRows = (r.assetRuns || []).map((a) => `<tr>
    <td>${a.assetId}</td><td>${tag(labelOf(a.status), clsOf(a.status))}</td>
    <td>${a.runId ? a.runId.slice(0, 12) : "-"}</td>
    <td>${(a.status === "PRODUCT_FAILURE" || a.status === "ASSERTION_FAILURE") ? `<button class="ghost" onclick="createIssueDraft('${a.assetId}')">Create Issue Draft</button>` : ""}
        ${a.status === "MODEL_FAILURE" ? `<button class="ghost" onclick="createModelingRequest('${a.assetId}')">Open Modeling Request</button>` : ""}
        ${a.status === "ENVIRONMENT_FAILURE" ? '<span class="dim">Target unreachable — environment issue, not product</span>' : ""}</td>
  </tr>`).join("");
  $("#plan-msg").innerHTML = `<h3>Regression Run ${r.regressionRunId}（env=${r.environment}）</h3>
    <table><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>${Object.entries(r.summary).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody></table>
    ${assetRows ? `<h3>Per-Asset</h3><table><thead><tr><th>Asset</th><th>Status</th><th>Run</th><th>Action</th></tr></thead><tbody>${assetRows}</tbody></table>` : ""}`;
  toast("Regression run completed");
}

// ============ Review Queue ============
async function loadQueue() {
  const items = await api("/api/workspace/review-queue");
  $("#queue").innerHTML = `<div class="panel"><h2>Review Queue（${items.length}）</h2>
    <table><thead><tr><th>Type</th><th>Priority</th><th>Release</th><th>Reason</th><th>Created</th><th>Source</th></tr></thead>
    <tbody>${items.map((i) => `<tr><td>${tag(i.type, i.priority === "HIGH" || i.priority === "CRITICAL" ? "err" : "warn")}</td><td>${i.priority}</td><td>${i.release}</td><td>${i.reason}</td><td>${new Date(i.createdAt).toLocaleString()}</td><td class="dim">${i.sourceRef}</td></tr>`).join("")}</tbody></table></div>`;
}

// ============ Coverage ============
async function loadCoverage() {
  const cov = await api("/api/workspace/coverage");
  const td = Object.entries(cov.testDesign).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  const ex = Object.entries(cov.execution).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  $("#coverage").innerHTML = `<div class="grid">
    <div class="panel"><h2>Test Design Coverage</h2><table>${td}</table></div>
    <div class="panel"><h2>Execution Coverage</h2><table>${ex}</table></div>
  </div>`;
}

async function createIssueDraft(assetId) {
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "CREATE_ISSUE_DRAFT", assetId, requirementId: state.requirement }) });
  toast(res.ok ? `Issue Draft ${res.result.draftId} created（不提交外部系统）` : `失败: ${res.error}`, !res.ok);
}
async function createModelingRequest(assetId) {
  const res = await api("/api/workspace/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "CREATE_MODELING_REQUEST", assetId }) });
  toast(res.ok ? `ModelingRequest ${res.result.requestId} created（${res.result.status}，不直接编辑 locator）` : `失败: ${res.error}`, !res.ok);
}

// ============ Search ============
function loadSearch() {
  $("#search").innerHTML = `<div class="panel"><h2>Search（deterministic，无 vector DB）</h2>
    <input type="text" id="search-q" placeholder="输入 2FA / TA-xxx / capability…"/>
    <button class="action" style="margin-top:8px" onclick="doSearch()">Search</button>
    <div id="search-res"></div></div>`;
}
async function doSearch() {
  const q = $("#search-q").value.trim();
  const res = await api(`/api/workspace/search?q=${encodeURIComponent(q)}`);
  $("#search-res").innerHTML = Object.entries(res).map(([k, v]) => v.length ? `<h3>${k} (${v.length})</h3><div>${v.slice(0, 10).join(", ")}</div>` : "").join("") || '<div class="dim">无结果</div>';
}

// ============ Diagnostics ============
async function loadDiagnostics() {
  const [health, overview] = await Promise.all([api("/api/workspace/health"), api("/api/workspace/overview")]);
  $("#diagnostics").innerHTML = `<div class="panel"><h2>Diagnostics / System Health</h2>
    <table><thead><tr><th>Doctor</th><th>Status</th><th>Issues</th></tr></thead>
    <tbody>${Object.entries(health).map(([k, v]) => `<tr><td>${k}</td><td>${tag(v.pass ? "PASS" : "FAIL", v.pass ? "ok" : "err")}</td><td class="dim">${v.issues.join("; ") || "-"}</td></tr>`).join("")}</tbody></table>
    <h3>AI Assistance（诚实状态）</h3>
    <div>${tag("AI DESIGNER: UNVERIFIED / AI_OPTIONAL", "warn")} <span class="dim">Provider unavailable — Systematic Design available</span></div>
    <h3>Projection</h3>
    <div class="dim">fingerprint=${overview.fingerprint} · capabilities=${overview.capabilities.length} · generatedAt=${overview.generatedAt}</div>
  </div>`;
}

// ============ Entity Deep Link（P15.6-15..18） ============
async function renderEntity(entityType, entityId) {
  let body = `<div class="panel"><h2>Entity Not Found</h2><div class="err">${entityType} ${entityId} 不存在或不可访问</div><button class="ghost" onclick="activate('overview')">返回 Overview</button></div>`;
  try {
    if (entityType === "asset") {
      const overview = await api("/api/workspace/overview");
      const cap = overview.capabilities.find((c) => c.testAssets.includes(entityId));
      if (cap) body = `<div class="panel"><h2>TestAsset ${entityId}</h2><div>所属 capability: ${cap.capabilityId}</div><div>相关 requirement: ${cap.requirements.join(", ")}</div><button class="ghost" onclick="activate('product')">去 Product 视图</button></div>`;
    } else if (entityType === "requirement") {
      const overview = await api("/api/workspace/overview");
      const caps = overview.capabilities.filter((c) => c.requirements.includes(entityId));
      if (caps.length) body = `<div class="panel"><h2>Requirement ${entityId}</h2><div>相关 capability: ${caps.map((c) => c.capabilityId).join(", ")}</div><button class="ghost" onclick="activate('release')">去 Release 视图</button></div>`;
    } else if (entityType === "capability") {
      const overview = await api("/api/workspace/overview");
      const cap = overview.capabilities.find((c) => c.capabilityId === entityId);
      body = cap ? `<div class="panel"><h2>Capability ${cap.capabilityId}</h2><div>assets=${cap.testAssets.length} ready=${cap.coverage.executionReady} lastRun=${cap.lastRun ?? "-"}</div><button class="ghost" onclick="activate('product')">去 Product 视图</button></div>` : body;
    } else if (entityType === "run") {
      body = `<div class="panel"><h2>Run ${entityId}</h2><div class="dim">Run detail 见 Execution Store（diagnostics）</div><button class="ghost" onclick="activate('diagnostics')">去 Diagnostics</button></div>`;
    } else if (entityType === "release") {
      state.requirement = entityId;
      const rel = await api(`/api/workspace/release?releaseId=release-${entityId}&requirement=${entityId}`);
      const isHistorical = !!rel.regressionPlan && rel.regressionPlan.version !== "v1";
      body = `<div class="panel"><h2>Release ${entityId} ${isHistorical ? tag("HISTORICAL SNAPSHOT", "warn") : tag("CURRENT SNAPSHOT", "ok")}</h2><div>status=${rel.requirementStatus} · plan=${rel.regressionPlan ? rel.regressionPlan.version : "none"} · next=${rel.recommendedNextAction}</div><button class="ghost" onclick="activate('release')">去 Release Workspace</button></div>`;
    }
  } catch (e) {
    body = `<div class="panel"><h2>Entity Not Found</h2><div class="err">${entityType} ${entityId} 加载失败</div></div>`;
  }
  $("#entity-detail").innerHTML = body;
  $("#entity-detail").style.display = "block";
  state.deepLink = { entityType, entityId };
  location.hash = `${entityType}/${entityId}`;
}

// deep link / refresh recovery
function parseDeepLink() {
  const hash = location.hash.replace("#", "");
  if (VIEWS.includes(hash)) return { view: hash };
  const m = hash.match(/^(asset|run|requirement|capability|release)[/](.+)$/);
  if (m) return { view: "overview", entityType: m[1], entityId: m[2] };
  return { view: "overview" };
}
const dl = parseDeepLink();
if (dl.entityType) {
  activate("overview");
  renderEntity(dl.entityType, dl.entityId);
} else if (VIEWS.includes(dl.view)) {
  activate(dl.view);
} else {
  activate("overview");
}
</script>
</body>
